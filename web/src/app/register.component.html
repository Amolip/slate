<main class="shell">
  <header class="top">
    <a class="mark" href="https://amolip.github.io">Amol</a>
    <div class="top-actions">
      <app-theme-toggle />
      <span>Slate</span>
    </div>
  </header>

  <section class="auth panel reveal">
    <p class="eyebrow">Create account</p>
    <h1>Start a short list.</h1>
    <p class="lede">
      Name, email, and a strong password.
      <span *ngIf="demo"> This live demo stores data in your browser.</span>
      <span *ngIf="!demo"> The NestJS API holds the session and tasks.</span>
    </p>

    <form (ngSubmit)="submit()">
      <label>
        Name
        <input name="name" [(ngModel)]="name" autocomplete="name" required>
      </label>
      <label>
        Email
        <input name="email" type="email" [(ngModel)]="email" autocomplete="email" required>
      </label>
      <label>
        Password
        <span class="password-field">
          <input
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            autocomplete="new-password"
            required
            minlength="8"
            aria-describedby="password-rules"
          >
          <button
            type="button"
            class="text-btn password-toggle"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </span>
      </label>

      <div class="strength" aria-hidden="true">
        <span *ngFor="let rule of rules" [class.on]="rule.met"></span>
      </div>

      <ul
        id="password-rules"
        class="password-rules"
        aria-live="polite"
        aria-label="Password strength requirements"
      >
        <li *ngFor="let rule of rules" [class.met]="rule.met" [class.missing]="!rule.met">
          <span class="rule-icon" aria-hidden="true"></span>
          {{ rule.label }}
        </li>
      </ul>

      <p class="error" *ngIf="error()">{{ error() }}</p>
      <button
        class="btn btn-primary"
        type="submit"
        [class.is-busy]="pending()"
        [disabled]="pending() || !passwordReady"
      >
        {{ pending() ? 'Working' : 'Create account' }}
      </button>
    </form>

    <p class="switch">
      <a class="text-btn" routerLink="/login">Already have an account? Sign in</a>
    </p>
  </section>
</main>
